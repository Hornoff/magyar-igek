<style>
/* Layout: one narrow column like a deck of cards on a desk; Hungarian words set in the serif, Russian in the sans. */
:root {
  --bg: #f3f4ef;
  --surface: #ffffff;
  --sunk: #e9ebe4;
  --ink: #1c231f;
  --muted: #5d6962;
  --line: #d6dad1;
  --accent: #2c6a4e;
  --accent-ink: #ffffff;
  --paprika: #b8432a;
  --ok: #2e7a4d;
  --ok-soft: #dcefe2;
  --bad: #b23a2a;
  --bad-soft: #f6dfd9;
  --hu: "Young Serif", Georgia, "Times New Roman", serif;
  --ru: "Onest", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1b211e; --sunk: #232a26; --ink: #e6ebe7; --muted: #9ba79f;
    --line: #2f3833; --accent: #6dbb91; --accent-ink: #0f1a14; --paprika: #e3785e;
    --ok: #7fcf9c; --ok-soft: #1f3a2a; --bad: #ef8a76; --bad-soft: #43231d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --sunk: #232a26; --ink: #e6ebe7; --muted: #9ba79f;
  --line: #2f3833; --accent: #6dbb91; --accent-ink: #0f1a14; --paprika: #e3785e;
  --ok: #7fcf9c; --ok-soft: #1f3a2a; --bad: #ef8a76; --bad-soft: #43231d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--ru);
  padding-inline: 16px;
  padding-block: 20px 40px;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hu { font-family: var(--hu); font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--hu); font-size: 34px; line-height: 1.1; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stat { text-align: right; font-variant-numeric: tabular-nums; }
.stat b { font-size: 22px; color: var(--accent); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* Groups */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.group {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center;
  text-align: left; padding: 12px; border: 1.5px solid var(--line); border-radius: var(--radius);
  background: var(--surface); min-width: 0;
}
.group[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.glyph {
  grid-row: span 2; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: var(--sunk); font-size: 20px; color: var(--muted);
}
.group[aria-pressed="true"] .glyph { background: var(--accent); color: var(--accent-ink); }
.group .name { font-family: var(--hu); font-size: 18px; line-height: 1.2; }
.group .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group .bar { grid-column: 1 / -1; margin-top: 8px; height: 4px; }
.row-links { display: flex; gap: 14px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }

/* Modes */
.modes { display: grid; gap: 8px; }
.mode {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); text-align: left;
}
.mode:hover { border-color: var(--accent); }
.mode:disabled { opacity: .45; cursor: not-allowed; }
.mode .t { font-weight: 600; }
.mode .s { font-size: 13px; color: var(--muted); }
.mode .go { color: var(--accent); font-size: 20px; }
.mode.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode.primary .s, .mode.primary .go { color: var(--accent-ink); opacity: .85; }

.settings { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Session */
.session-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.card {
  background: var(--surface); border-radius: 20px; border: 1px solid var(--line);
  padding: 28px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; min-height: 240px;
  align-content: center;
}
.card .front.hu { font-size: clamp(30px, 8vw, 42px); line-height: 1.15; overflow-wrap: anywhere; }
.card .front.ru { font-size: clamp(22px, 6vw, 28px); font-weight: 600; line-height: 1.25; }
.card .front.prompt { font-size: clamp(21px, 5.5vw, 26px); }
.card .back.hu { font-size: clamp(28px, 7vw, 38px); }
.card .back.ru { font-size: 20px; color: var(--muted); }
.card hr { width: 60%; border: 0; border-top: 1px dashed var(--line); margin: 4px 0; }
.example { display: grid; gap: 2px; max-width: 46ch; }
.example .hu { font-size: 18px; }
.gap { display: inline-block; min-width: 2.4em; border-bottom: 2px solid var(--paprika); color: var(--paprika); }
.speak {
  border: 1px solid var(--line); background: var(--sunk); border-radius: 99px; padding: 6px 14px;
  font-size: 14px; display: inline-flex; gap: 6px; align-items: center;
}
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: var(--radius); padding: 15px; font-weight: 600; font-size: 16px; }
.btn.main { background: var(--accent); color: var(--accent-ink); grid-column: 1 / -1; }
.btn.no { background: var(--bad-soft); color: var(--bad); }
.btn.yes { background: var(--ok-soft); color: var(--ok); }
.options { display: grid; gap: 8px; }
.opt {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left;
  padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; min-width: 0;
}
.opt.hu { font-family: var(--hu); font-size: 19px; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.solution { background: var(--sunk); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; }
.solution .hu { font-size: 19px; }

/* Summary & list */
.summary { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 20px 0; }
.score { font-family: var(--hu); font-size: 54px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.review { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.review ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.search { width: 100%; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.verbs { list-style: none; margin: 0; padding: 0; display: grid; }
.verbs li { display: grid; grid-template-columns: 14px 1fr; gap: 4px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.verbs .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; border: 2px solid var(--line); }
.verbs .dot.seen { border-color: var(--paprika); background: var(--paprika); }
.verbs .dot.learned { border-color: var(--ok); background: var(--ok); }
.verbs .w { font-family: var(--hu); font-size: 19px; }
.verbs .ex { grid-column: 2; font-size: 13px; color: var(--muted); }
.verbs .ex i { color: var(--ink); font-style: normal; font-family: var(--hu); }
.note { font-size: 12px; color: var(--muted); text-align: center; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.confirm button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; }
.confirm .danger { border-color: var(--bad); color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

:2,"hu":"Mi bekapcsoljuk a gépet.","ru":"Мы включаем аппарат."},{"lesson":2,"hu":"Beírtam a nevet a listába.","ru":"Я внёс имя в список."},{"lesson":2,"hu":"Bezárták az ablakokat.","ru":"Они закрыли окна."},{"lesson":2,"hu":"Beadtad a jelentkezést.","ru":"Ты подал заявление."},{"lesson":2,"hu":"Az orvos behívta a következő beteget.","ru":"Врач вызвал следующего пациента."},{"lesson":2,"hu":"A tanár beengedi a diákokat.","ru":"Учитель впускает учеников."},{"lesson":2,"hu":"Bevásároltunk a hétvégére.","ru":"Мы закупились на выходные."},{"lesson":2,"hu":"A gyerekek beszálltak az autóba.","ru":"Дети сели в автомобиль."},{"lesson":2,"hu":"Nem mentem be az irodába.","ru":"Я не вошёл в офис."},{"lesson":2,"hu":"Mikor jössz be?","ru":"Когда ты войдёшь? (сюда)"},{"lesson":2,"hu":"Miért vitte be a széket?","ru":"Почему он внёс стул? (куда-то)"},{"lesson":2,"hu":"Ki hozta be a kávét?","ru":"Кто принёс кофе? (сюда)"},{"lesson":2,"hu":"Mit írsz be az űrlapba?","ru":"Что ты вписываешь в анкету?"},{"lesson":2,"hu":"Mi nem kapcsoljuk be a tévét.","ru":"Мы не включаем телевизор."},{"lesson":2,"hu":"Hova ülnek be?","ru":"Куда они заходят посидеть?"},{"lesson":2,"hu":"Melyik számlát fizetted be?","ru":"Какой (который из) счёт ты оплатил?"},{"lesson":2,"hu":"Csak Márta adta be a dokumentumokat.","ru":"Только Марта подала документы."},{"lesson":2,"hu":"Három vendéget engedtek be, nem négyet.","ru":"Они впустили трёх гостей, а не четырёх."},{"lesson":2,"hu":"Ne vedd be ezt a gyógyszert!","ru":"Не принимай это лекарство!"},{"lesson":2,"hu":"Most tedd be a könyvet a táskába!","ru":"Сейчас положи книгу в сумку!"},{"lesson":2,"hu":"Ki zárta be az üzletet?","ru":"Кто закрыл магазин?"},{"lesson":2,"hu":"Miért jelentkeztetek be ilyen későn?","ru":"Почему вы так поздно зарегистрировались?"},{"lesson":2,"hu":"Senki sem lépett be a terembe.","ru":"Никто не вошёл в зал."},{"lesson":2,"hu":"Mikor ment ki Anna?","ru":"Когда Анна вышла?"},{"lesson":2,"hu":"Ki jött ki a szobából?","ru":"Кто вышел из комнаты?"},{"lesson":2,"hu":"Melyik dobozt hoztad ki a garázsból?","ru":"Какую (которую из) коробку ты принёс из гаража?"},{"lesson":2,"hu":"Este vidd ki a szemetet!","ru":"Вечером вынеси мусор!"},{"lesson":2,"hu":"Nem vitték ki a gyerekeket az udvarra.","ru":"Они не вывели детей во двор."},{"lesson":2,"hu":"Be akarok menni.","ru":"Я хочу войти."},{"lesson":2,"hu":"Nem akar bejönni.","ru":"Она не хочет заходить."},{"lesson":2,"hu":"Nem kell bevinned a széket.","ru":"Тебе не нужно заносить стул."},{"lesson":2,"hu":"Be tudsz jönni most?","ru":"Ты можешь сейчас войти?"},{"lesson":2,"hu":"Mikor tudsz bejönni?","ru":"Когда ты можешь войти?"},{"lesson":2,"hu":"Nyolckor be szoktak menni.","ru":"Они обычно входят в восемь часов."},{"lesson":2,"hu":"Nem szokott itt bemenni.","ru":"Он обычно не входит здесь."},{"lesson":2,"hu":"Ki akarok menni.","ru":"Я хочу выйти."},{"lesson":2,"hu":"Nem akarunk kimenni.","ru":"Мы не хотим выходить."},{"lesson":2,"hu":"Ki kell hoznod a dobozt.","ru":"Тебе нужно вынести (сюда) коробку."},{"lesson":2,"hu":"Ma nem kell kivinnünk a szemetet.","ru":"Сегодня нам не нужно выносить мусор."},{"lesson":2,"hu":"Hamarosan ki fog jönni.","ru":"Он скоро выйдет."},{"lesson":2,"hu":"Ki tudsz vinni minket az állomásra?","ru":"Ты можешь отвезти нас на вокзал?"},{"lesson":2,"hu":"Szeretnék bemenni.","ru":"Я хотел бы войти."},{"lesson":2,"hu":"Szeretnék kimenni.","ru":"Я хотел бы выйти."},{"lesson":3,"hu":"Ma korán indulsz?","ru":"Ты сегодня рано уходишь?"},{"lesson":3,"hu":"Akkor ki tudod vinni a szemetet?","ru":"Тогда ты сможешь вынести мусор?"},{"lesson":3,"hu":"Tegnap betetted a felső fiókba.","ru":"Вчера ты положил их в верхний ящик."},{"lesson":3,"hu":"Nincs ott. Nem vetted ki véletlenül?","ru":"Там их нет. Ты их не вынимала случайно?"},{"lesson":3,"hu":"A vasaló már ki van kapcsolva, de az ablak még nyitva van.","ru":"Утюг уже выключен, но окно ещё открыто."},{"lesson":3,"hu":"Indulás előtt becsukom az ablakot, és kiviszem a szemetet.","ru":"Перед уходом я <script>
(() => {
  const course = JSON.parse(document.getElementById('course-data').textContent);
  const app = document.getElementById('app');

  // Направление приставки — тот самый пространственный образ из курса.
  const GLYPHS = { top100: '★', be: '↘', ki: '↗', fel: '↑', le: '↓', el: '→' };
  const MODES = [
    { id: 'cardsHuRu', t: 'Карточки: венгерский → русский', s: 'Видишь глагол, вспоминаешь значение', verbs: true },
    { id: 'cardsRuHu', t: 'Карточки: русский → венгерский', s: 'Видишь перевод, вспоминаешь глагол', verbs: true },
    { id: 'choiceRu', t: 'Тест: выбери перевод', s: '4 варианта перевода', verbs: true },
    { id: 'choiceHu', t: 'Тест: выбери венгерский глагол', s: '4 похожих глагола, самый трудный', verbs: true },
    { id: 'prefixes', t: 'Приставки в предложениях', s: 'be- / ki- / fel- / le- / el- в контексте', verbs: false },
    { id: 'sentences', t: 'Фразы из курса', s: 'Переведи фразу на венгерский', verbs: false },
  ];
  const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
  const LEARNED_BOX = 3;
  const DAY = 86400000;

  // ---------- storage (per viewer) ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('hu:' + key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) { try { localStorage.setItem('hu:' + key, JSON.stringify(value)); } catch { /* приватный режим */ } },
  };
  let progress = store.get('progress', {});
  let selected = new Set(store.get('groups', ['top100']));
  let sessionSize = store.get('size', 15);

  const state = id => progress[id] || { box: 0, due: 0, correct: 0, wrong: 0 };
  const isNew = id => { const s = state(id); return s.correct + s.wrong === 0; };
  const isDue = id => !isNew(id) && state(id).due <= Date.now();
  const isLearned = id => state(id).box >= LEARNED_BOX;

  function record(id, correct) {
    const s = { ...state(id) };
    if (correct) { s.correct++; s.box = Math.min(s.box + 1, INTERVALS.length - 1); }
    else { s.wrong++; s.box = 0; }
    s.due = Date.now() + INTERVALS[s.box] * DAY;
    progress = { ...progress, [id]: s };
    store.set('progress', progress);
  }

  // Просроченные (слабые раньше) → новые по порядку курса → остальные по сроку.
  function sessionOrder(items, idOf) {
    const due = items.filter(x => isDue(idOf(x))).sort((a, b) => state(idOf(a)).box - state(idOf(b)).box);
    const fresh = items.filter(x => isNew(idOf(x)));
    const rest = items.filter(x => !isNew(idOf(x)) && !isDue(idOf(x))).sort((a, b) => state(idOf(a)).due - state(idOf(b)).due);
    return [...due, ...fresh, ...rest].slice(0, sessionSize);
  }

  const verbId = v => 'verb:' + v.hu;
  const sentId = s => 'sent:' + s.hu;
  const quizId = q => 'quiz:' + q.prompt + '|' + q.answer;
  const verbsIn = ids => course.verbs.filter(v => ids.has(v.group));
  const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const solved = q => {
    const s = q.prompt.split('___').join(q.answer).replace(' (я)', '');
    return q.prompt.startsWith('___') ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  };

  // ---------- speech ----------
  let huVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    huVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('hu')) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'hu-HU';
      if (huVoice) u.voice = huVoice;
      u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch { /* озвучка недоступна */ }
  }

  // ---------- tiny DOM helper ----------
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  }
  const speakBtn = text => h('button', { class: 'speak', type: 'button', onclick: () => speak(text), 'aria-label': 'Прослушать: ' + text }, '🔊 Прослушать');
  const render = (...nodes) => { app.replaceChildren(...nodes); window.scrollTo(0, 0); };

  // ---------- home ----------
  function home() {
    const allIds = course.verbs.map(verbId);
    const learned = allIds.filter(isLearned).length;
    const due = allIds.filter(isDue).length;
    const chosen = verbsIn(selected);

    const groups = course.groups.map(g => {
      const ids = course.verbs.filter(v => v.group === g.id).map(verbId);
      const l = ids.filter(isLearned).length;
      return h('button', {
        class: 'group', type: 'button', 'aria-pressed': String(selected.has(g.id)),
        onclick: () => { selected.has(g.id) ? selected.delete(g.id) : selected.add(g.id); store.set('groups', [...selected]); home(); },
      },
        h('span', { class: 'glyph', 'aria-hidden': 'true' }, GLYPHS[g.id] || '•'),
        h('span', { class: 'name' }, g.title),
        h('span', { class: 'meta' }, `${g.subtitle} · ${l}/${ids.length}`),
        h('span', { class: 'bar' }, h('i', { style: `width:${ids.length ? l / ids.length * 100 : 0}%` })),
      );
    });

    const modes = MODES.map((m, i) => h('button', {
      class: 'mode' + (i === 0 ? ' primary' : ''), type: 'button',
      disabled: m.verbs && chosen.length === 0, onclick: () => start(m.id),
    }, h('span', {}, h('div', { class: 't' }, m.t), h('div', { class: 's' }, m.s)), h('span', { class: 'go', 'aria-hidden': 'true' }, '→')));

    const sizes = h('span', { class: 'seg', role: 'group', 'aria-label': 'Карточек за сессию' },
      [10, 15, 20, 30].map(n => h('button', { type: 'button', 'aria-pressed': String(sessionSize === n), onclick: () => { sessionSize = n; store.set('size', n); home(); } }, n)));

    let confirming = false;
    const resetBox = h('div', { class: 'confirm' });
    const drawReset = () => resetBox.replaceChildren(...(confirming
      ? [h('span', {}, 'Обнулить весь прогресс?'),
         h('button', { class: 'danger', type: 'button', onclick: () => { progress = {}; store.set('progress', progress); home(); } }, 'Да, обнулить'),
         h('button', { type: 'button', onclick: () => { confirming = false; drawReset(); } }, 'Отмена')]
      : [h('button', { class: 'link', type: 'button', onclick: () => { confirming = true; drawReset(); } }, 'Сбросить прогресс')]));
    drawReset();

    render(
      h('header', { class: 'top' },
        h('div', { class: 'brand' }, h('h1', {}, 'Magyar igék'), h('p', {}, 'Тренажёр к курсу «Венгерские глаголы», вебинары 1–6')),
        h('div', { class: 'stat' }, h('b', {}, learned), h('span', { class: 'muted' }, ` / ${allIds.length} выучено`),
          due ? h('div', { class: 'small', style: 'color:var(--paprika)' }, `${due} ждут повторения`) : null)),
      h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': allIds.length, 'aria-valuenow': learned },
        h('i', { style: `width:${learned / allIds.length * 100}%` })),
      h('section', { style: 'display:grid;gap:10px' },
        h('div', { class: 'label' }, `Тренировка · выбрано глаголов: ${chosen.length}`),
        h('div', { class: 'modes' }, modes)),
      h('section', { style: 'display:grid;gap:10px' },
        h('div', { class: 'label' }, 'Какие глаголы учим'),
        h('div', { class: 'groups' }, groups),
        h('div', { class: 'row-links' },
          h('span', { class: 'small muted' }, 'Списки:'),
          course.groups.map(g => h('button', { class: 'link', type: 'button', onclick: () => list(g) }, g.title)))),
      h('section', { class: 'settings' }, h('span', {}, 'Карточек за сессию'), sizes),
      resetBox,
      h('p', { class: 'note' }, 'Прогресс хранится в этом браузере. Голос — венгерский из вашего телефона или компьютера.'),
    );
  }

  // ---------- sessions ----------
  function start(mode) {
    if (mode === 'cardsHuRu' || mode === 'cardsRuHu') {
      const huFirst = mode === 'cardsHuRu';
      const cards = sessionOrder(verbsIn(selected), verbId).map(v => ({
        id: verbId(v), front: huFirst ? v.hu : v.ru, back: huFirst ? v.ru : v.hu, huFront: huFirst, exHu: v.exHu, exRu: v.exRu,
      }));
      return flashcards(MODES.find(m => m.id === mode).t, cards);
    }
    if (mode === 'sentences') {
      const cards = sessionOrder(course.sentences, sentId).map(s => ({ id: sentId(s), front: s.ru, back: s.hu, huFront: false }));
      return flashcards('Фразы из курса', cards);
    }
    if (mode === 'choiceRu' || mode === 'choiceHu') {
      const huToRu = mode === 'choiceRu';
      const show = v => huToRu ? v.ru : v.hu;
      const qs = sessionOrder(verbsIn(selected), verbId).map(v => {
        const pool = [...shuffle(course.verbs.filter(o => o.group === v.group && o.hu !== v.hu)), ...shuffle(course.verbs.filter(o => o.group !== v.group))];
        const wrong = [];
        for (const o of pool) { const t = show(o); if (t !== show(v) && !wrong.includes(t)) wrong.push(t); if (wrong.length === 3) break; }
        return {
          id: verbId(v), prompt: huToRu ? v.hu : v.ru, promptHu: huToRu, optionsHu: !huToRu, hint: null,
          options: shuffle([show(v), ...wrong]), answer: show(v),
          solHu: v.exHu || v.hu, solRu: v.exHu ? v.exRu : v.ru, review: `${v.hu} — ${v.ru}`,
        };
      });
      return choice(MODES.find(m => m.id === mode).t, qs);
    }
    if (mode === 'prefixes') {
      const qs = sessionOrder(course.quiz, quizId).map(q => ({
        id: quizId(q), prompt: q.prompt, promptHu: true, optionsHu: true, hint: q.ru || null,
        options: shuffle([q.answer, ...shuffle(q.options.filter(o => o !== q.answer)).slice(0, 3)]), answer: q.answer,
        solHu: solved(q), solRu: q.ru || null, review: solved(q) + (q.ru ? ' — ' + q.ru : ''),
      }));
      return choice('Приставки в предложениях', qs);
    }
  }

  function sessionHead(title, i, total) {
    return [
      h('div', { class: 'session-head' },
        h('button', { class: 'back', type: 'button', onclick: home }, '← Назад'),
        h('strong', { style: 'min-width:0' }, title),
        h('span', { class: 'count' }, `${Math.min(i + 1, total)} из ${total}`)),
      h('div', { class: 'bar' }, h('i', { style: `width:${total ? i / total * 100 : 0}%` })),
    ];
  }

  function emptySession(title) {
    render(...sessionHead(title, 0, 0), h('div', { class: 'card' }, h('p', {}, 'Нет карточек. Отметь хотя бы одну группу глаголов.')));
  }

  function summary(correct, total, mistakes) {
    render(h('div', { class: 'summary' },
      h('div', { class: 'label' }, 'Сессия завершена'),
      h('div', { class: 'score' }, `${correct}/${total}`),
      h('p', { class: 'muted', style: 'margin:0' }, 'верно с первого раза'),
      mistakes.length ? h('div', { class: 'review' }, h('strong', {}, 'Повторить'), h('ul', {}, mistakes.map(m => h('li', {}, m)))) : h('p', {}, 'Ни одной ошибки. Szép munka!'),
      h('div', { class: 'actions', style: 'width:100%' }, h('button', { class: 'btn main', type: 'button', onclick: home }, 'Готово'))));
  }

  function flashcards(title, cards) {
    if (!cards.length) return emptySession(title);
    const queue = [...cards];
    const requeued = new Set();
    const missed = new Map();
    let i = 0, firstTry = 0;

    function draw(revealed) {
      if (i >= queue.length) return summary(firstTry, cards.length, [...missed.values()]);
      const c = queue[i];
      const huText = c.huFront ? c.front : c.back;
      const body = [h('div', { class: 'front ' + (c.huFront ? 'hu' : 'ru') }, c.front)];
      if (c.huFront) body.push(speakBtn(c.front));
      if (revealed) {
        body.push(h('hr'), h('div', { class: 'back ' + (c.huFront ? 'ru' : 'hu') }, c.back));
        if (!c.huFront) body.push(speakBtn(c.back));
        if (c.exHu) body.push(h('div', { class: 'example' },
          h('button', { class: 'link hu', type: 'button', style: 'font-size:18px;font-weight:400', onclick: () => speak(c.exHu) }, '🔊 ' + c.exHu),
          c.exRu ? h('span', { class: 'muted small' }, c.exRu) : null));
      }
      const answer = ok => {
        record(c.id, ok);
        if (ok) { if (!requeued.has(c.id)) firstTry++; }
        else {
          missed.set(c.id, `${huText} — ${c.huFront ? c.back : c.front}`);
          if (!requeued.has(c.id)) { requeued.add(c.id); queue.push(c); }
        }
        i++; draw(false);
      };
      render(...sessionHead(title, i, queue.length),
        h('div', { class: 'card' }, body),
        revealed
          ? h('div', { class: 'actions' },
              h('button', { class: 'btn no', type: 'button', onclick: () => answer(false) }, '✕ Не помню'),
              h('button', { class: 'btn yes', type: 'button', onclick: () => answer(true) }, '✓ Помню'))
          : h('div', { class: 'actions' }, h('button', { class: 'btn main', type: 'button', onclick: () => { draw(true); if (!c.huFront) speak(c.back); } }, 'Показать ответ')));
      if (!revealed && c.huFront) speak(c.front);
    }
    draw(false);
  }

  function choice(title, qs) {
    if (!qs.length) return emptySession(title);
    let i = 0, right = 0;
    const mistakes = [];

    function promptNode(q) {
      if (!q.prompt.includes('___')) return h('div', { class: 'front ' + (q.promptHu ? 'hu' : 'ru') }, q.prompt);
      const parts = q.prompt.split('___');
      return h('div', { class: 'front hu prompt' }, parts[0], h('span', { class: 'gap', 'aria-label': 'пропуск' }, ' '), parts.slice(1).join('___'));
    }

    function draw(picked) {
      if (i >= qs.length) return summary(right, qs.length, mistakes);
      const q = qs[i];
      const opts = q.options.map(o => {
        let cls = 'opt' + (q.optionsHu ? ' hu' : '');
        if (picked != null) { if (o === q.answer) cls += ' right'; else if (o === picked) cls += ' wrong'; }
        return h('button', { class: cls, type: 'button', disabled: picked != null, onclick: () => pick(o) },
          h('span', {}, o), picked != null && o === q.answer ? '✓' : picked === o ? '✕' : '');
      });
      const card = [promptNode(q)];
      if (q.hint) card.push(h('div', { class: 'muted' }, q.hint));
      if (q.promptHu && !q.prompt.includes('___')) card.push(speakBtn(q.prompt));
      render(...sessionHead(title, i, qs.length),
        h('div', { class: 'card', style: 'min-height:180px' }, card),
        h('div', { class: 'options' }, opts),
        picked != null ? h('div', { class: 'solution' },
          h('button', { class: 'link hu', type: 'button', style: 'font-size:19px;font-weight:400;text-align:left', onclick: () => speak(q.solHu) }, '🔊 ' + q.solHu),
          q.solRu ? h('span', { class: 'muted small' }, q.solRu) : null) : null,
        picked != null ? h('div', { class: 'actions' }, h('button', { class: 'btn main', type: 'button', onclick: () => { i++; draw(null); } }, i + 1 < qs.length ? 'Дальше' : 'Итоги')) : null);
      if (picked == null && q.promptHu && !q.prompt.includes('___')) speak(q.prompt);
    }

    function pick(o) {
      const q = qs[i];
      const ok = o === q.answer;
      record(q.id, ok);
      if (ok) right++; else mistakes.push(q.review);
      speak(q.solHu);
      draw(o);
    }
    draw(null);
  }

  // ---------- verb list ----------
  function list(group) {
    const verbs = course.verbs.filter(v => v.group === group.id);
    const ul = h('ul', { class: 'verbs' });
    const fill = q => {
      const query = q.trim().toLowerCase();
      ul.replaceChildren(...verbs.filter(v => !query || v.hu.toLowerCase().includes(query) || v.ru.toLowerCase().includes(query)).map(v => {
        const id = verbId(v);
        const dot = isLearned(id) ? 'learned' : isNew(id) ? '' : 'seen';
        return h('li', { onclick: () => speak(v.hu), tabindex: 0, onkeydown: e => { if (e.key === 'Enter') speak(v.hu); } },
          h('span', { class: 'dot ' + dot, 'aria-hidden': 'true' }),
          h('span', {}, h('span', { class: 'w' }, v.hu), h('span', { class: 'muted' }, ' — ' + v.ru)),
          v.exHu ? h('span', { class: 'ex' }, h('i', {}, v.exHu), v.exRu ? ' · ' + v.exRu : '') : null);
      }));
    };
    const input = h('input', { class: 'search', id: 'verb-search', type: 'search', placeholder: 'Поиск по глаголам', oninput: e => fill(e.target.value) });
    fill('');
    render(
      h('div', { class: 'session-head' },
        h('button', { class: 'back', type: 'button', onclick: home }, '← Назад'),
        h('strong', {}, `${group.title} · ${group.subtitle}`),
        h('span', { class: 'count' }, verbs.length)),
      input, ul,
      h('p', { class: 'note' }, 'Нажми на глагол, чтобы услышать. Зелёная точка — выучен, оранжевая — в процессе.'));
  }

  home();
})();
</script>
</body>
</html>
